name: AgentTunnel Release

# Builds the desktop app for macOS, Linux, and Windows and publishes the
# artifacts to a GitHub Release. Builds are unsigned: this repository has no
# Apple/Azure signing secrets configured. Add them and pass --signed in the
# build step if you want signed installers later.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (for example 0.1.0). Defaults to the pushed tag."
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: agenttunnel-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [[ -z "$raw" && "${{ github.ref_type }}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$raw" ]]; then
            raw="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: vp install
      - name: Build desktop artifact
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}"
            --verbose
          )
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentTunnel ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: release-assets/*
