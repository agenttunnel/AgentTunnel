name: AgentTunnel Release

# Builds the Go app for macOS, Linux, and Windows and publishes the artifacts
# to a GitHub Release. Builds are unsigned: this repository has no Apple/Azure
# signing secrets configured.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (for example 0.1.0). Defaults to the pushed tag."
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: agenttunnel-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [[ -z "$raw" && "${{ github.ref_type }}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$raw" ]]; then
            raw="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build-go:
    name: Build Go ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: arm64
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            arch: amd64
          - runner: blacksmith-4vcpu-windows-2025
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agenttunnel-go/go.mod
          cache-dependency-path: |
            agenttunnel-go/go.sum
            agenttunnel-go/desktop/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agenttunnel-go/desktop/frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 targets GTK4 and WebKitGTK 6.0 by default. GTK3/4.1 is
          # only used with -tags gtk3, which this build does not pass.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev
      - name: Build frontend
        working-directory: agenttunnel-go/desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Build Go binaries
        working-directory: agenttunnel-go
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.platform == 'windows' && '0' || '1' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          desktop_ldflags="-w -s"
          if [[ "$GOOS" == "windows" ]]; then
            ext=".exe"
            desktop_ldflags="-w -s -H windowsgui"
          fi

          mkdir -p go-dist
          go build -trimpath -buildvcs=false -ldflags="-w -s" -o "go-dist/atd${ext}" ./cmd/atd
          (
            cd desktop
            go build -tags production -trimpath -buildvcs=false \
              -ldflags="$desktop_ldflags" -o "../go-dist/agenttunnel${ext}" .
          )

          printf '%s\n' "$VERSION" > go-dist/VERSION
          tar -czf "agenttunnel-go-${GOOS}-${GOARCH}.tar.gz" -C go-dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-go-${{ matrix.platform }}-${{ matrix.arch }}
          path: agenttunnel-go/agenttunnel-go-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-go]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Stage Go installer
        run: |
          cp agenttunnel-go/scripts/install.sh release-assets/install-agenttunnel-go.sh
          chmod +x release-assets/install-agenttunnel-go.sh
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentTunnel ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: release-assets/*
      - name: Add install notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$existing" == *"Install notes"* ]]; then
            exit 0
          fi
          note="$(printf '\n### Install notes\n\nmacOS builds are unsigned, so Gatekeeper may quarantine the downloaded archive. After extracting, clear the quarantine flag before first run:\n\n```\nxattr -d com.apple.quarantine ./agenttunnel\n```\n\nOr install with the bundled script, which handles this for you:\n\n```\ncurl -fsSL https://github.com/agenttunnel/AgentTunnel/releases/latest/download/install-agenttunnel-go.sh | sh\n```\n')"
          printf '%s%s' "$existing" "$note" | gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file -
