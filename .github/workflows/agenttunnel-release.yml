name: AgentTunnel Release

# Builds the desktop app for macOS, Linux, and Windows and publishes the
# artifacts to a GitHub Release. Builds are unsigned when no signing secrets are
# configured. Add a Developer ID certificate (CSC_LINK/CSC_KEY_PASSWORD) plus an
# App Store Connect notary key (APPLE_API_KEY/APPLE_API_KEY_ID/APPLE_API_ISSUER)
# and macOS builds are signed and notarized automatically. The passkey
# entitlements additionally need APPLE_TEAM_ID and MACOS_PROVISIONING_PROFILE.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (for example 0.1.0). Defaults to the pushed tag."
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: agenttunnel-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [[ -z "$raw" && "${{ github.ref_type }}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$raw" ]]; then
            raw="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: mac
            target: dmg
            arch: arm64
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - runner: windows-latest
            platform: win
            target: nsis
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: vp install
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      - id: build_artifact
        name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ secrets.T3CODE_CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              # Passkey (Associated Domains) entitlements are opt-in: they need an
              # explicit provisioning profile. Without one the app is still
              # Developer ID signed and notarized with the default entitlements.
              if has_all "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
                profile_path="$RUNNER_TEMP/agenttunnel.provisionprofile"
                printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
                security cms -D -i "$profile_path" >/dev/null
                export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
                export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"
                echo "macOS passkey entitlements enabled."
              else
                echo "macOS passkey entitlements disabled (no APPLE_TEAM_ID/MACOS_PROVISIONING_PROFILE)."
              fi

              echo "macOS signing enabled."
              args+=(--signed)
              echo "signed=true" >> "$GITHUB_OUTPUT"
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
              echo "signed=false" >> "$GITHUB_OUTPUT"
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "${{ secrets.AZURE_TENANT_ID }}" \
              "${{ secrets.AZURE_CLIENT_ID }}" \
              "${{ secrets.AZURE_CLIENT_SECRET }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing Azure Trusted Signing secrets)."
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish
      # Travels with the artifacts so the release job can tell signed from
      # unsigned builds without re-reading secrets. Consumed and removed there.
      - name: Record macOS signing status
        if: matrix.platform == 'mac' && steps.build_artifact.outputs.signed == 'true'
        shell: bash
        run: touch release-publish/macos-signed
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - id: macos_signing
        name: Detect macOS signing
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f release-assets/macos-signed ]]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            rm -f release-assets/macos-signed
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentTunnel ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: release-assets/*
      - name: Add install notes
        if: steps.macos_signing.outputs.signed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$existing" == *"Install notes"* ]]; then
            exit 0
          fi
          note="$(printf '\n### Install notes\n\nThis macOS build is unsigned, so Gatekeeper reports the app as damaged until the quarantine flag is cleared. With the GitHub CLI authenticated, install and clear it in one command:\n\n```\ngh api repos/%s/contents/scripts/install-macos.sh -H "Accept: application/vnd.github.raw" | bash -s -- --repo %s --version %s\n```\n\nOr, after installing the disk image manually:\n\n```\nxattr -dr com.apple.quarantine "/Applications/AgentTunnel (Alpha).app"\n```\n\nAdding Apple signing secrets to the repository removes this step.\n' "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY" "$tag")"
          printf '%s%s' "$existing" "$note" | gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file -
