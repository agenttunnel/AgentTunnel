name: AgentTunnel Release

# Builds the desktop app for macOS, Linux, and Windows and publishes the
# artifacts to a GitHub Release. Builds are unsigned: this repository has no
# Apple/Azure signing secrets configured. Add them and pass --signed in the
# build step if you want signed installers later.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (for example 0.1.0). Defaults to the pushed tag."
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: agenttunnel-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        run: |
          set -euo pipefail
          raw="${{ inputs.version }}"
          if [[ -z "$raw" && "${{ github.ref_type }}" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$raw" ]]; then
            raw="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
          - runner: blacksmith-4vcpu-windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup vp
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
      - name: Install dependencies
        run: vp install
      - name: Install Linux packaging dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y imagemagick
      # The desktop artifact build compiles native/resource-monitor with cargo.
      # Install the toolchain explicitly instead of inheriting whatever the
      # runner image ships: macos-14 images lag, and rustc 1.89 there cannot
      # build sysinfo 0.39 (needs 1.95).
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Build desktop artifact
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ secrets.T3CODE_CLERK_PASSKEY_RP_DOMAINS }}
        run: |
          set -euo pipefail
          args=(
            --platform "${{ matrix.platform }}"
            --target "${{ matrix.target }}"
            --arch "${{ matrix.arch }}"
            --build-version "${{ needs.prepare.outputs.version }}"
            --verbose
          )

          has_all() {
            for value in "$@"; do
              if [[ -z "$value" ]]; then
                return 1
              fi
            done
            return 0
          }

          if [[ "${{ matrix.platform }}" == "mac" ]]; then
            if has_all "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_API_KEY" "$APPLE_API_KEY_ID" "$APPLE_API_ISSUER" "$APPLE_TEAM_ID" "$MACOS_PROVISIONING_PROFILE"; then
              key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
              printf '%s' "$APPLE_API_KEY" > "$key_path"
              export APPLE_API_KEY="$key_path"

              profile_path="$RUNNER_TEMP/agenttunnel.provisionprofile"
              printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
              export T3CODE_APPLE_TEAM_ID="$APPLE_TEAM_ID"
              export T3CODE_MACOS_PROVISIONING_PROFILE="$profile_path"

              echo "macOS signing enabled."
              args+=(--signed)
            else
              echo "macOS signing disabled (missing one or more Apple signing secrets)."
            fi
          elif [[ "${{ matrix.platform }}" == "win" ]]; then
            if has_all \
              "${{ secrets.AZURE_TENANT_ID }}" \
              "${{ secrets.AZURE_CLIENT_ID }}" \
              "${{ secrets.AZURE_CLIENT_SECRET }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}" \
              "${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}"; then
              echo "Windows signing enabled (Azure Trusted Signing)."
              args+=(--signed)
            else
              echo "Windows signing disabled (missing Azure Trusted Signing secrets)."
            fi
          fi

          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-publish
          shopt -s nullglob
          for pattern in \
            "release/*.dmg" \
            "release/*.zip" \
            "release/*.AppImage" \
            "release/*.exe" \
            "release/*.blockmap" \
            "release/*.yml"; do
            for file in $pattern; do
              cp "$file" release-publish/
            done
          done
          ls -la release-publish
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-publish/*
          if-no-files-found: error

  build-go:
    name: Build Go ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: arm64
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            arch: amd64
          - runner: blacksmith-4vcpu-windows-2025
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agenttunnel-go/go.mod
          cache-dependency-path: |
            agenttunnel-go/go.sum
            agenttunnel-go/desktop/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agenttunnel-go/desktop/frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Build frontend
        working-directory: agenttunnel-go/desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Build Go binaries
        working-directory: agenttunnel-go
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.platform == 'windows' && '0' || '1' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          desktop_ldflags="-w -s"
          if [[ "$GOOS" == "windows" ]]; then
            ext=".exe"
            desktop_ldflags="-w -s -H windowsgui"
          fi

          mkdir -p go-dist
          go build -trimpath -buildvcs=false -ldflags="-w -s" -o "go-dist/atd${ext}" ./cmd/atd
          (
            cd desktop
            go build -tags production -trimpath -buildvcs=false \
              -ldflags="$desktop_ldflags" -o "../go-dist/agenttunnel${ext}" .
          )

          printf '%s\n' "$VERSION" > go-dist/VERSION
          tar -czf "agenttunnel-go-${GOOS}-${GOARCH}.tar.gz" -C go-dist .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-go-${{ matrix.platform }}-${{ matrix.arch }}
          path: agenttunnel-go/agenttunnel-go-*.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build, build-go]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Stage Go installer
        run: |
          cp agenttunnel-go/scripts/install.sh release-assets/install-agenttunnel-go.sh
          chmod +x release-assets/install-agenttunnel-go.sh
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentTunnel ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          generate_release_notes: true
          files: release-assets/*
      - name: Add install notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$existing" == *"Install notes"* ]]; then
            exit 0
          fi
          note="$(printf '\n### Install notes\n\nmacOS builds are unsigned, so Gatekeeper may report the app as damaged. After installing, clear the quarantine flag:\n\n```\nxattr -dr com.apple.quarantine "/Applications/AgentTunnel (Alpha).app"\n```\n\nAdding Apple signing secrets to the repository removes this step.\n')"
          printf '%s%s' "$existing" "$note" | gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file -
