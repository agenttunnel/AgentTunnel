name: AgentTunnel Release

# Builds the Go app for macOS, Linux, and Windows and publishes the artifacts
# to a GitHub Release. Builds are unsigned: this repository has no Apple/Azure
# signing secrets configured.
#
# Versions:
#   - pushed tag vX.Y.Z    -> release vX.Y.Z (stable, the installer default)
#   - every push to main   -> prerelease main-<short sha>, version <short sha>
#                             (7 chars). Prereleases are never "latest", so
#                             releases/latest keeps pointing at tagged builds.
#   - workflow_dispatch    -> the given version, or 0.0.0-dev.<run number>
# The version is embedded in atd and the desktop binary as main.version.
#
# Loop safety: this workflow pushes no commits. The release and its tag are
# created with GITHUB_TOKEN, and events from GITHUB_TOKEN do not start new runs.
# It also does not listen to release events, so publishing cannot re-trigger it.
on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build and release (for example 0.1.0). Defaults to the pushed tag, or the short commit hash on main."
        required: false
        type: string
      draft:
        description: "Publish the release as a draft"
        required: false
        default: false
        type: boolean

concurrency:
  group: agenttunnel-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare:
    name: Resolve version
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - id: version
        name: Compute version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          raw="$INPUT_VERSION"
          if [[ -z "$raw" && "$REF_TYPE" == "tag" ]]; then
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ -z "$raw" && "$EVENT_NAME" == "push" && "$REF" == "refs/heads/main" ]]; then
            version="${GITHUB_SHA:0:7}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
            echo "tag=main-${version}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$raw" ]]; then
            raw="0.0.0-dev.${GITHUB_RUN_NUMBER}"
          fi
          version="${raw#v}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"

  build-go:
    name: Build Go ${{ matrix.platform }}-${{ matrix.arch }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: arm64
          - runner: blacksmith-6vcpu-macos-15
            platform: darwin
            arch: amd64
          - runner: blacksmith-4vcpu-ubuntu-2404
            platform: linux
            arch: amd64
          - runner: blacksmith-4vcpu-windows-2025
            platform: windows
            arch: amd64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agenttunnel-go/go.mod
          cache-dependency-path: |
            agenttunnel-go/go.sum
            agenttunnel-go/desktop/go.sum
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agenttunnel-go/desktop/frontend/package-lock.json
      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Wails v3 targets GTK4 and WebKitGTK 6.0 by default. GTK3/4.1 is
          # only used with -tags gtk3, which this build does not pass.
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev libayatana-appindicator3-dev
      - name: Build frontend
        working-directory: agenttunnel-go/desktop/frontend
        run: |
          npm ci
          npm run build
      - name: Build Go binaries
        working-directory: agenttunnel-go
        shell: bash
        env:
          GOOS: ${{ matrix.platform }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: ${{ matrix.platform == 'windows' && '0' || '1' }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ext=""
          ldflags="-w -s -X main.version=${VERSION}"
          desktop_ldflags="$ldflags"
          if [[ "$GOOS" == "windows" ]]; then
            ext=".exe"
            desktop_ldflags="$ldflags -H windowsgui"
          fi

          mkdir -p go-dist
          go build -trimpath -buildvcs=false -ldflags="$ldflags" -o "go-dist/atd${ext}" ./cmd/atd
          go build -trimpath -buildvcs=false -ldflags="$ldflags" -o "go-dist/agenttunnel${ext}" ./cmd/agenttunnel
          (
            cd desktop
            go build -tags production -trimpath -buildvcs=false \
              -ldflags="$desktop_ldflags" -o "../go-dist/agenttunnel-desktop${ext}" .
          )

          printf '%s\n' "$VERSION" > go-dist/VERSION
          tar -czf "agenttunnel-go-${GOOS}-${GOARCH}.tar.gz" -C go-dist .
      - name: Package macOS app and DMG
        if: matrix.platform == 'darwin'
        working-directory: agenttunnel-go/desktop
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          ./build-app.sh --no-build --binary ../go-dist/agenttunnel-desktop \
            --version "$VERSION" --arch "${{ matrix.arch }}" --dmg
          # Keep the bundle files in the same directory as the tarball so the
          # artifact is flat. A nested subdirectory here would be silently
          # dropped by the release job's `release-assets/*` glob.
          cp "dist/AgentTunnel-darwin-${{ matrix.arch }}.app.tar.gz" ..
          cp "dist/AgentTunnel-darwin-${{ matrix.arch }}.dmg" ..
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: agenttunnel-go-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            agenttunnel-go/agenttunnel-go-*.tar.gz
            agenttunnel-go/AgentTunnel-darwin-*.app.tar.gz
            agenttunnel-go/AgentTunnel-darwin-*.dmg
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build-go]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Stage Go installer
        run: |
          cp agenttunnel-go/scripts/install.sh release-assets/install-agenttunnel-go.sh
          chmod +x release-assets/install-agenttunnel-go.sh
      - name: Verify release assets
        run: |
          set -euo pipefail
          for asset in \
            agenttunnel-go-darwin-arm64.tar.gz \
            agenttunnel-go-darwin-amd64.tar.gz \
            agenttunnel-go-linux-amd64.tar.gz \
            agenttunnel-go-windows-amd64.tar.gz \
            AgentTunnel-darwin-arm64.app.tar.gz \
            AgentTunnel-darwin-amd64.app.tar.gz \
            AgentTunnel-darwin-arm64.dmg \
            AgentTunnel-darwin-amd64.dmg \
            install-agenttunnel-go.sh; do
            if [ ! -f "release-assets/${asset}" ]; then
              echo "missing release asset: ${asset}" >&2
              ls -R release-assets >&2
              exit 1
            fi
          done
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AgentTunnel ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: release-assets/*
      - name: Add install notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          existing="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body)"
          if [[ "$existing" == *"Install notes"* ]]; then
            exit 0
          fi
          note='

          ### Install notes

          **macOS** — download `AgentTunnel-darwin-arm64.dmg` (Apple Silicon) or
          `AgentTunnel-darwin-amd64.dmg` (Intel), open it, and drag AgentTunnel into
          Applications. The builds are unsigned; if Gatekeeper quarantines the app:

          ```
          xattr -dr com.apple.quarantine /Applications/AgentTunnel.app
          ```

          The installer does this for you, installs the app into ~/Applications, and puts
          the CLI on your PATH:

          ```
          curl -fsSL https://github.com/agenttunnel/AgentTunnel/releases/latest/download/install-agenttunnel-go.sh | sh
          ```

          **Linux / Windows** — the archives contain `atd`, the `agenttunnel` CLI, and the
          `agenttunnel-desktop` binary.
          '
          printf '%s%s' "$existing" "$note" | gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file -
