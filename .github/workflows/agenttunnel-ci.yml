name: AgentTunnel CI

# Builds and tests the Go app on every push and pull request so a broken build
# is caught before release. The installers are built by the AgentTunnel Release
# workflow.
on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: agenttunnel-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go:
    name: Build and test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    defaults:
      run:
        working-directory: agenttunnel-go
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: agenttunnel-go/go.mod
          cache-dependency-path: |
            agenttunnel-go/go.sum
            agenttunnel-go/desktop/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" $unformatted
            exit 1
          fi
      - name: Test
        run: go test ./... -count=1
      - name: Test (race)
        run: go test -race ./internal/orchestrator/ ./internal/toolbox/ ./pkg/daemon/ -count=1

  frontend:
    name: Build desktop frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agenttunnel-go/desktop/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: agenttunnel-go/desktop/frontend/package-lock.json
      - name: Build
        run: |
          npm ci
          npm run build
