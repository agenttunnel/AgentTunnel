name: Import secrets and variables to Depot CI
on: push

permissions:
  id-token: write
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import secrets
        env:
          APNS_PRIVATE_KEY: ${{ secrets.APNS_PRIVATE_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          DISCORD_RELEASE_LATEST_ROLE_ID: ${{ secrets.DISCORD_RELEASE_LATEST_ROLE_ID }}
          DISCORD_RELEASE_NIGHTLY_ROLE_ID: ${{ secrets.DISCORD_RELEASE_NIGHTLY_ROLE_ID }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          PLANETSCALE_API_TOKEN: ${{ secrets.PLANETSCALE_API_TOKEN }}
          PLANETSCALE_API_TOKEN_ID: ${{ secrets.PLANETSCALE_API_TOKEN_ID }}
          RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
          RELEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          T3CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ secrets.T3CODE_CLERK_PASSKEY_RP_DOMAINS }}
          T3CODE_CLERK_PUBLISHABLE_KEY: ${{ secrets.T3CODE_CLERK_PUBLISHABLE_KEY }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          unset DEPOT_TOKEN
          depot ci secrets add APNS_PRIVATE_KEY="$APNS_PRIVATE_KEY" APPLE_API_ISSUER="$APPLE_API_ISSUER" APPLE_API_KEY="$APPLE_API_KEY" APPLE_API_KEY_ID="$APPLE_API_KEY_ID" APPLE_TEAM_ID="$APPLE_TEAM_ID" AUR_SSH_PRIVATE_KEY="$AUR_SSH_PRIVATE_KEY" AXIOM_TOKEN="$AXIOM_TOKEN" AZURE_CLIENT_ID="$AZURE_CLIENT_ID" AZURE_CLIENT_SECRET="$AZURE_CLIENT_SECRET" AZURE_TENANT_ID="$AZURE_TENANT_ID" AZURE_TRUSTED_SIGNING_ACCOUNT_NAME="$AZURE_TRUSTED_SIGNING_ACCOUNT_NAME" AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME="$AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME" AZURE_TRUSTED_SIGNING_ENDPOINT="$AZURE_TRUSTED_SIGNING_ENDPOINT" AZURE_TRUSTED_SIGNING_PUBLISHER_NAME="$AZURE_TRUSTED_SIGNING_PUBLISHER_NAME" CLERK_SECRET_KEY="$CLERK_SECRET_KEY" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" CSC_KEY_PASSWORD="$CSC_KEY_PASSWORD" CSC_LINK="$CSC_LINK" DISCORD_RELEASE_LATEST_ROLE_ID="$DISCORD_RELEASE_LATEST_ROLE_ID" DISCORD_RELEASE_NIGHTLY_ROLE_ID="$DISCORD_RELEASE_NIGHTLY_ROLE_ID" DISCORD_RELEASE_WEBHOOK_URL="$DISCORD_RELEASE_WEBHOOK_URL" EXPO_TOKEN="$EXPO_TOKEN" MACOS_PROVISIONING_PROFILE="$MACOS_PROVISIONING_PROFILE" PLANETSCALE_API_TOKEN="$PLANETSCALE_API_TOKEN" PLANETSCALE_API_TOKEN_ID="$PLANETSCALE_API_TOKEN_ID" RELEASE_APP_ID="$RELEASE_APP_ID" RELEASE_APP_PRIVATE_KEY="$RELEASE_APP_PRIVATE_KEY" T3CODE_CLERK_PASSKEY_RP_DOMAINS="$T3CODE_CLERK_PASSKEY_RP_DOMAINS" T3CODE_CLERK_PUBLISHABLE_KEY="$T3CODE_CLERK_PUBLISHABLE_KEY" VERCEL_ORG_ID="$VERCEL_ORG_ID" VERCEL_PROJECT_ID="$VERCEL_PROJECT_ID" VERCEL_TOKEN="$VERCEL_TOKEN" --repo WaelRabah/AgentTunnel
  variables:
    runs-on: ubuntu-latest
    steps:
      - uses: depot/setup-action@v1
      - name: Import variables
        env:
          APNS_BUNDLE_ID: ${{ vars.APNS_BUNDLE_ID }}
          APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT }}
          APNS_KEY_ID: ${{ vars.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ vars.APNS_TEAM_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
          CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.CLERK_CLI_OAUTH_CLIENT_ID }}
          CLERK_JWT_AUDIENCE: ${{ vars.CLERK_JWT_AUDIENCE }}
          CLERK_JWT_TEMPLATE: ${{ vars.CLERK_JWT_TEMPLATE }}
          CLERK_PASSKEY_RP_DOMAINS: ${{ vars.CLERK_PASSKEY_RP_DOMAINS }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PLANETSCALE_ORGANIZATION: ${{ vars.PLANETSCALE_ORGANIZATION }}
          RELAY_API_ZONE_NAME: ${{ vars.RELAY_API_ZONE_NAME }}
          RELAY_DOMAIN: ${{ vars.RELAY_DOMAIN }}
          RELAY_TUNNEL_ZONE_NAME: ${{ vars.RELAY_TUNNEL_ZONE_NAME }}
          T3CODE_WEB_LATEST_DOMAIN: ${{ vars.T3CODE_WEB_LATEST_DOMAIN }}
          T3CODE_WEB_NIGHTLY_DOMAIN: ${{ vars.T3CODE_WEB_NIGHTLY_DOMAIN }}
          T3CODE_WEB_ROUTER_URL: ${{ vars.T3CODE_WEB_ROUTER_URL }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG }}
        run: |
          unset DEPOT_TOKEN
          depot ci vars add APNS_BUNDLE_ID="$APNS_BUNDLE_ID" APNS_ENVIRONMENT="$APNS_ENVIRONMENT" APNS_KEY_ID="$APNS_KEY_ID" APNS_TEAM_ID="$APNS_TEAM_ID" APPLE_TEAM_ID="$APPLE_TEAM_ID" AXIOM_ORG_ID="$AXIOM_ORG_ID" CLERK_CLI_OAUTH_CLIENT_ID="$CLERK_CLI_OAUTH_CLIENT_ID" CLERK_JWT_AUDIENCE="$CLERK_JWT_AUDIENCE" CLERK_JWT_TEMPLATE="$CLERK_JWT_TEMPLATE" CLERK_PASSKEY_RP_DOMAINS="$CLERK_PASSKEY_RP_DOMAINS" CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID" PLANETSCALE_ORGANIZATION="$PLANETSCALE_ORGANIZATION" RELAY_API_ZONE_NAME="$RELAY_API_ZONE_NAME" RELAY_DOMAIN="$RELAY_DOMAIN" RELAY_TUNNEL_ZONE_NAME="$RELAY_TUNNEL_ZONE_NAME" T3CODE_WEB_LATEST_DOMAIN="$T3CODE_WEB_LATEST_DOMAIN" T3CODE_WEB_NIGHTLY_DOMAIN="$T3CODE_WEB_NIGHTLY_DOMAIN" T3CODE_WEB_ROUTER_URL="$T3CODE_WEB_ROUTER_URL" VERCEL_TEAM_SLUG="$VERCEL_TEAM_SLUG" --repo WaelRabah/AgentTunnel
  cleanup:
    needs: [secrets, variables]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          expected_branch_pattern='^depot-migrate-secrets-[0123456789bcdfghjklmnpqrstvwxz]{10}$'
          if [[ ! "$GITHUB_REF_NAME" =~ $expected_branch_pattern ]]; then
            echo "Refusing to delete unexpected branch ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}"
