<svg width="432" height="432" viewBox="0 0 432 432" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- AgentTunnel mark inside Android's 66dp adaptive-icon safe zone. The 432px canvas is
       108dp at 4x, so the safe circle has a 132px radius. The mark's ink is 101.94 x 98 units
       on its own 128-unit canvas with its centre at (64,65); scaling by 1.9343 puts its furthest
       ink — the bottom corners of the A's feet, 67.985 units from that centre — at 131.5px from
       the canvas centre, i.e. half a pixel inside the safe radius so no launcher mask can clip it
       (the margin absorbs antialiasing). The translate centres the ink on the canvas centre. -->
  <g transform="translate(92.21 90.27) scale(1.9343)">
    <path
      fill-rule="evenodd"
      clip-rule="evenodd"
      d="M64 16C59.6 16 55.5 18.4 53.3 22.5L13.7 104.7C11.6 109.1 14.8 114 19.7 114H108.3C113.2 114 116.4 109.1 114.3 104.7L74.7 22.5C72.5 18.4 68.4 16 64 16Z M64 46C55.8 46 48 53.8 48 62V78H80V62C80 53.8 72.2 46 64 46Z M64 92L41 114H87Z"
      fill="#FFFFFF"
    />
  </g>
</svg>
